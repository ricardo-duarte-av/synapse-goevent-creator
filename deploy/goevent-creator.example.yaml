# goevent-creator configuration.
#
# Only what is ours: Synapse's own facts (events writer, instance map,
# replication secret, database, signing key) are read from homeserver.yaml.

homeserver_yaml: /etc/synapse/homeserver.yaml

listen:
  # nginx connects here. Keep the path under 108 bytes.
  socket: /var/sockets/nginx/av-goevent-creator-1.sock
  socket_mode: "0660"

upstream:
  # Main is the fallback for everything not served here: the goal is retiring
  # the Python event_creator (av-client-events-1), so nothing depends on it.
  sockets:
    - /var/sockets/nginx/av-synapse-main.sock
  timeout_seconds: 300

metrics:
  addr: ":9102"

log:
  level: info

# The rooms this worker may write to. Only rooms compiled into
# internal/allowlist are accepted; anything else fails at start.
rooms:
  - "!decSfHzLLhrNKJaZid:aguiarvieira.pt"   # TEST6TEST
  - "!nmZrvcKkeQiFGRlJtE:aguiarvieira.pt"   # TEST7TESTE

# Every endpoint must be given a mode:
#   proxy   forward to the upstream, untouched
#   shadow  forward too, and for writes in the rooms above check afterwards
#           that we would have built the event Synapse built. Writes nothing.
#   native  (send, state, redact, membership, join) create events in the
#           rooms above here; whatever is declined is proxied and shadowed.
#           Creates the role goevent_creator.
modes:
  send: shadow
  state: shadow
  redact: shadow
  membership: shadow
  join: shadow
  knock: proxy       # or native: knocks on rooms this server is in (remote ones are main's)
  profile: proxy     # proxy only: profile writes touch every room the user is in

# Needed by shadow. The session is read-only (default_transaction_read_only),
# and the worker refuses to start if it is not.
database:
  # Empty: homeserver.yaml's database and user, straight to PostgreSQL's
  # socket in `host` (homeserver.yaml's own host is pgcat, which only knows
  # the users in its own config).
  dsn: ""
  host: /var/sockets
  max_conns: 4

# (auth: whoami_socket/cache_seconds are no longer used: requesters are
# identified from Synapse's database.)

shadow:
  concurrency: 8
  timeout_seconds: 30
  # Check writes in every room, not only the allowlisted ones. Read-only:
  # writes stay limited to the allowlist. Each such request is read before it
  # is forwarded, within prepare_ms, at most prepare_concurrency at a time;
  # beyond either it is just forwarded (goevent_shadow_checks_total
  # {check="request",result="skip_slow"|"skip_busy"}).
  all_rooms: false
  prepare_ms: 250
  prepare_concurrency: 8
