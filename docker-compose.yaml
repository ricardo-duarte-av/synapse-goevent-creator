# goevent-creator.
#
# A standalone compose file for running the worker beside an existing Synapse
# deployment, written to match the Synapse worker services there (unix sockets
# under /var/sockets, the npm-nw networks, uid 991).
#
# Before first start:
#
#   mkdir -p ./goevent
#   cp deploy/goevent-creator.example.yaml ./goevent/goevent-creator.yaml
#   chown -R 991:991 ./goevent
#
# Then point a TEST hostname's event_creator locations at it
# (deploy/nginx.conf.example). It starts in proxy mode, which changes nothing.

services:
  av-goevent-creator-1:
    image: ghcr.io/ricardo-duarte-av/synapse-goevent-creator:latest
    container_name: av-goevent-creator-1
    restart: unless-stopped
    user: "991:991"

    command: ["-config", "/data/goevent-creator.yaml"]

    volumes:
      # goevent-creator.yaml.
      - ./goevent:/data
      # Synapse's config directory, READ-ONLY: homeserver.yaml is the source
      # of truth for the events writer, the instance map, the replication
      # secret, the database and the signing key, and this worker must never
      # be able to change it.
      - /opt/matrix/synapse/synapse:/etc/synapse:ro
      # nginx reaches us here; we reach Synapse main (the fallback), the
      # stream writers' replication sockets and PostgreSQL here.
      - /var/sockets:/var/sockets

    networks:
      - npm-nw6
      - npm-nw

    # Distroless: no curl, so the binary probes its own listener.
    healthcheck:
      test: ["CMD", "/goevent-creator", "-healthcheck", "-config", "/data/goevent-creator.yaml"]
      start_period: "2s"
      interval: "10s"
      timeout: "5s"
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The e2e suite's fake MSC4284 policy server, policy.aguiarvieira.pt: its
  # own minimal homeserver (keys, one bot, /send, /_matrix/policy/v1/sign).
  # The reverse proxy forwards policy.aguiarvieira.pt:443 to the host's
  # 28448; the control listener (mode, join) is the host's localhost only.
  #
  #   mkdir -p ./policy && chown 991:991 ./policy   # keys are kept here
  goevent-policy:
    image: ghcr.io/ricardo-duarte-av/synapse-goevent-creator:latest
    container_name: goevent-policy
    restart: unless-stopped
    user: "991:991"
    entrypoint: ["/goevent-policy"]
    command: ["-server", "policy.aguiarvieira.pt", "-listen", ":28448", "-control", ":28449", "-data", "/data"]
    volumes:
      - ./policy:/data
    ports:
      - "28448:28448"
      - "127.0.0.1:28449:28449"

networks:
  npm-nw6:
    external: true
  npm-nw:
    external: true
    enable_ipv6: false
